name: Coze Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coze-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Info
        id: pr-info
        run: |
          # 获取 PR 基本信息
          echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          
          # 处理 PR body，替换换行符和特殊字符
          BODY="${{ github.event.pull_request.body }}"
          BODY_ESCAPED=$(printf '%s' "$BODY" | tr '\n' ' ' | tr '"' "'")
          echo "body=${BODY_ESCAPED}" >> $GITHUB_OUTPUT

          # 使用 gh CLI 获取 diff（自动使用 GITHUB_TOKEN 认证）
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} | head -c 50000)
          DIFF_ENCODED=$(printf '%s' "$DIFF" | base64 -w 0)
          echo "diff_encoded=${DIFF_ENCODED}" >> $GITHUB_OUTPUT
          echo "diff_length=${#DIFF}" >> $GITHUB_OUTPUT
          echo "Diff length: ${#DIFF}"
          
          # 输出 diff 链接到日志
          echo "PR Diff URL: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}.diff"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Call Coze API
        id: coze
        run: |
          # 解码 diff
          DIFF_DECODED=$(echo "${{ steps.pr-info.outputs.diff_encoded }}" | base64 -d)
          
          # 构造请求
          JSON_PAYLOAD=$(jq -n \
            --arg workflow_id "${{ secrets.COZE_WORKFLOW_ID }}" \
            --arg title "${{ steps.pr-info.outputs.title }}" \
            --arg body "${{ steps.pr-info.outputs.body }}" \
            --arg diff "$DIFF_DECODED" \
            --arg pr_number "${{ github.event.number }}" \
            '{
              workflow_id: $workflow_id,
              parameters: {
                pr_title: $title,
                pr_description: $body,
                diff_content: $diff,
                pr_number: $pr_number
              }
            }')

          # 输出请求内容到日志（脱敏处理）
          echo "=== Coze API Request ==="
          echo "Workflow ID: ${{ secrets.COZE_WORKFLOW_ID }}"
          echo "PR Title: ${{ steps.pr-info.outputs.title }}"
          echo "PR Number: ${{ github.event.number }}"
          echo "Diff length: ${{ steps.pr-info.outputs.diff_length }}"
          echo "Diff preview (first 500 chars):"
          echo "$DIFF_DECODED" | head -c 500
          echo ""
          echo "========================="

          # 调用 API
          RESPONSE=$(curl -s -X POST "https://api.coze.cn/v1/workflow/run" \
            -H "Authorization: Bearer ${{ secrets.COZE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          # 输出原始响应到日志
          echo "=== Coze API Raw Response ==="
          echo "$RESPONSE" | jq '.' 2>/dev/null || echo "$RESPONSE"
          echo "============================="

          # 提取工作流返回的数据（Coze 的响应结构）
          # data 字段是 JSON 字符串，需要解析两次
          # 完整结构：{code, msg, data: "{output: {...}}"}
          RAW_DATA=$(echo "$RESPONSE" | jq -r '.data' 2>/dev/null)
          
          # 解析 data 字段（是 JSON 字符串）
          PARSED_DATA=$(echo "$RAW_DATA" | jq -r '.' 2>/dev/null)
          
          # 提取 output 字段（可能是字符串或对象）
          OUTPUT_FIELD=$(echo "$PARSED_DATA" | jq -r '.output' 2>/dev/null)
          
          # 如果 output 是字符串，需要再次解析
          if echo "$OUTPUT_FIELD" | jq -e 'type == "string"' > /dev/null 2>&1; then
            REVIEW_DATA=$(echo "$OUTPUT_FIELD" | jq -r '.' 2>/dev/null)
          else
            REVIEW_DATA="$OUTPUT_FIELD"
          fi
          
          # 如果上面的解析失败，尝试直接使用 output
          if [ -z "$REVIEW_DATA" ] || [ "$REVIEW_DATA" = "null" ]; then
            REVIEW_DATA=$(echo "$PARSED_DATA" | jq -r '.output' 2>/dev/null || echo "$RAW_DATA")
          fi

          echo "=== Parsed Review Data ==="
          echo "$REVIEW_DATA" | jq '.' 2>/dev/null || echo "$REVIEW_DATA"
          echo "=========================="

          echo "result<<COZE_EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_DATA" >> $GITHUB_OUTPUT
          echo "COZE_EOF" >> $GITHUB_OUTPUT

      - name: Process Review Result
        id: process
        run: |
          RESULT='${{ steps.coze.outputs.result }}'

          # 解析关键字段用于后续步骤
          SCORE=$(echo "$RESULT" | jq -r '.score // 0')
          CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion // "warning"')
          ERROR_COUNT=$(echo "$RESULT" | jq -r '.statistics.error_count // (.issues // [] | map(select(.severity == "error")) | length)')

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT

      - name: Post Review Comments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewResult = ${{ steps.coze.outputs.result }};

            // 验证必要字段
            if (!reviewResult.issues || !Array.isArray(reviewResult.issues)) {
              console.error('Coze 输出:', JSON.stringify(reviewResult, null, 2));
              core.setFailed('Coze 输出格式错误：缺少 issues 字段');
              return;
            }

            // 获取 PR 的 commits 以获取最新的 commit_id
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const latestCommitSha = commits[commits.length - 1].sha;

            // 获取 PR 的 files 列表，用于验证文件路径
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // 构建文件路径集合，用于验证
            const filePaths = new Set(prFiles.map(f => f.filename));

            // 收集行级评论
            const lineComments = [];
            
            // 构建汇总评论
            let summaryBody = `## 🔍 Coze AI 代码审查报告\n\n`;
            
            const score = reviewResult.score || 0;
            const scoreEmoji = score >= 90 ? '🟢' : score >= 70 ? '🟡' : '🔴';
            summaryBody += `### ${scoreEmoji} 综合评分：${score}/100\n\n`;

            const conclusion = reviewResult.conclusion || 'warning';
            const conclusionBadge = {
              'pass': '✅ **通过** - 代码质量良好，可以合并',
              'fail': '❌ **失败** - 存在严重问题，必须修复',
              'warning': '⚠️ **警告** - 存在问题，建议修复'
            }[conclusion];
            summaryBody += `**审查结论**：${conclusionBadge}\n\n`;

            if (reviewResult.summary) {
              summaryBody += `### 📋 审查摘要\n${reviewResult.summary}\n\n`;
            }

            const stats = reviewResult.statistics || {};
            const errorCount = stats.error_count ?? reviewResult.issues.filter(i => i.severity === 'error').length;
            const warningCount = stats.warning_count ?? reviewResult.issues.filter(i => i.severity === 'warning').length;
            const infoCount = stats.info_count ?? reviewResult.issues.filter(i => i.severity === 'info').length;

            summaryBody += `### 📊 问题统计\n`;
            summaryBody += `- ❌ 错误：${errorCount} 个\n`;
            summaryBody += `- ⚠️ 警告：${warningCount} 个\n`;
            summaryBody += `- ℹ️ 提示：${infoCount} 个\n\n`;

            // 处理每个 issue，添加行级评论
            for (const issue of reviewResult.issues) {
              // 跳过没有文件路径或行号的问题
              if (!issue.file || !issue.line || issue.line <= 0) {
                const severityEmoji = { 'error': '❌', 'warning': '⚠️', 'info': 'ℹ️' }[issue.severity] || '•';
                summaryBody += `${severityEmoji} **${issue.category || '通用'}** - ${issue.message}\n`;
                if (issue.suggestion) {
                  summaryBody += `  - 💡 建议：${issue.suggestion}\n\n`;
                }
                continue;
              }

              // 检查文件是否在 PR 变更中
              if (!filePaths.has(issue.file)) {
                // 文件不在 PR 变更中，添加到汇总评论
                const severityEmoji = { 'error': '❌', 'warning': '⚠️', 'info': 'ℹ️' }[issue.severity] || '•';
                const lineInfo = issue.absline ? `:${issue.absline}` : '';
                summaryBody += `${severityEmoji} **${issue.category || '通用'}** \`${issue.file}${lineInfo}\` - ${issue.message}\n`;
                if (issue.suggestion) {
                  summaryBody += `  - 💡 建议：${issue.suggestion}\n\n`;
                }
                continue;
              }

              // 构建行级评论内容
              let commentBody = `**${issue.severity.toUpperCase()}** - ${issue.category || '通用'}\n\n`;
              commentBody += `${issue.message}\n\n`;
              
              if (issue.suggestion) {
                commentBody += `💡 **建议**:\n${issue.suggestion}\n\n`;
              }

              if (issue.code_snippet) {
                const lang = issue.file.split('.').pop() || '';
                commentBody += `**原始代码**:\n\`\`\`${lang}\n${issue.code_snippet}\n\`\`\`\n\n`;
              }

              if (issue.fixed_code) {
                const lang = issue.file.split('.').pop() || '';
                commentBody += `✅ **修复后**:\n\`\`\`${lang}\n${issue.fixed_code}\n\`\`\`\n\n`;
              }

              if (issue.documentation_link) {
                commentBody += `📚 [查看文档](${issue.documentation_link})\n\n`;
              }

              commentBody += `---\n*由 Coze AI 自动生成*`;

              // 收集行级评论 - line 字段是 diff 中的相对位置
              lineComments.push({
                path: issue.file,
                position: issue.line,
                body: commentBody,
                side: 'RIGHT'
              });
            }

            // 添加 diff 链接到汇总评论
            summaryBody += `\n📄 [查看 PR Diff](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}.diff)\n`;
            summaryBody += `\n---\n*⏱️ 分析耗时：${reviewResult.time_cost?.total_time_ms || '-'}ms | 由 Coze AI 自动生成*`;

            // 如果没有行级评论，只添加汇总评论
            if (lineComments.length === 0) {
              summaryBody += `\n✅ 本次提交未发现需要行级评论的问题。`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summaryBody
              });
              return;
            }

            // 创建 PR Review（包含行级评论和汇总评论）
            const reviewPayload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              commit_id: latestCommitSha,
              body: summaryBody,
              event: 'COMMENT',
              comments: lineComments
            };

            console.log('Creating review with', lineComments.length, 'line comments');
            console.log('Line comments:', JSON.stringify(lineComments, null, 2));
            
            try {
              await github.rest.pulls.createReview(reviewPayload);
              console.log('Review created successfully');
            } catch (error) {
              console.error('Failed to create review:', error);
              
              // 如果创建行级评论失败，回退到普通评论
              if (error.status === 422 || error.status === 404) {
                console.log('Falling back to issue comment');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: summaryBody + '\n\n（行级评论创建失败，可能因为文件已修改或行号不匹配）'
                });
              } else {
                throw error;
              }
            }

      - name: Check Conclusion
        if: ${{ steps.process.outputs.conclusion == 'fail' }}
        run: |
          echo "::error::代码审查未通过，存在严重问题"
          exit 1
