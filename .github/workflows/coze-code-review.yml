name: Coze Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coze-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Info
        id: pr-info
        run: |
          # 获取 PR 基本信息
          echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          
          # 处理 PR body，替换换行符和特殊字符
          BODY="${{ github.event.pull_request.body }}"
          BODY_ESCAPED=$(printf '%s' "$BODY" | tr '\n' ' ' | tr '"' "'")
          echo "body=${BODY_ESCAPED}" >> $GITHUB_OUTPUT

          # 获取 diff 并 base64 编码避免特殊字符问题
          DIFF=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            "${{ github.event.pull_request.diff_url }}" | head -c 50000)
          DIFF_ENCODED=$(printf '%s' "$DIFF" | base64 -w 0)
          echo "diff_encoded=${DIFF_ENCODED}" >> $GITHUB_OUTPUT
          echo "diff_length=${#DIFF}" >> $GITHUB_OUTPUT
          echo "Diff length: ${#DIFF}"

      - name: Call Coze API
        id: coze
        run: |
          # 解码 diff
          DIFF_DECODED=$(echo "${{ steps.pr-info.outputs.diff_encoded }}" | base64 -d)
          
          # 构造请求
          JSON_PAYLOAD=$(jq -n \
            --arg workflow_id "${{ secrets.COZE_WORKFLOW_ID }}" \
            --arg title "${{ steps.pr-info.outputs.title }}" \
            --arg body "${{ steps.pr-info.outputs.body }}" \
            --arg diff "$DIFF_DECODED" \
            --arg pr_number "${{ github.event.number }}" \
            '{
              workflow_id: $workflow_id,
              parameters: {
                pr_title: $title,
                pr_description: $body,
                diff_content: $diff,
                pr_number: $pr_number
              }
            }')

          # 输出请求内容到日志（脱敏处理）
          echo "=== Coze API Request ==="
          echo "Workflow ID: ${{ secrets.COZE_WORKFLOW_ID }}"
          echo "PR Title: ${{ steps.pr-info.outputs.title }}"
          echo "PR Number: ${{ github.event.number }}"
          echo "Diff length: ${{ steps.pr-info.outputs.diff_length }}"
          echo "Diff preview (first 500 chars):"
          echo "$DIFF_DECODED" | head -c 500
          echo ""
          echo "========================="

          # 调用 API
          RESPONSE=$(curl -s -X POST "https://api.coze.cn/v1/workflow/run" \
            -H "Authorization: Bearer ${{ secrets.COZE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          # 输出原始响应到日志
          echo "=== Coze API Raw Response ==="
          echo "$RESPONSE" | jq '.' 2>/dev/null || echo "$RESPONSE"
          echo "============================="

          # 提取工作流返回的数据（Coze 的响应结构）
          # data 字段是 JSON 字符串，需要解析两次
          # 完整结构：{code, msg, data: "{output: {...}}"}
          RAW_DATA=$(echo "$RESPONSE" | jq -r '.data' 2>/dev/null)
          
          # 解析 data 字段（是 JSON 字符串）
          PARSED_DATA=$(echo "$RAW_DATA" | jq -r '.' 2>/dev/null)
          
          # 提取 output 字段（可能是字符串或对象）
          OUTPUT_FIELD=$(echo "$PARSED_DATA" | jq -r '.output' 2>/dev/null)
          
          # 如果 output 是字符串，需要再次解析
          if echo "$OUTPUT_FIELD" | jq -e 'type == "string"' > /dev/null 2>&1; then
            REVIEW_DATA=$(echo "$OUTPUT_FIELD" | jq -r '.' 2>/dev/null)
          else
            REVIEW_DATA="$OUTPUT_FIELD"
          fi
          
          # 如果上面的解析失败，尝试直接使用 output
          if [ -z "$REVIEW_DATA" ] || [ "$REVIEW_DATA" = "null" ]; then
            REVIEW_DATA=$(echo "$PARSED_DATA" | jq -r '.output' 2>/dev/null || echo "$RAW_DATA")
          fi

          echo "=== Parsed Review Data ==="
          echo "$REVIEW_DATA" | jq '.' 2>/dev/null || echo "$REVIEW_DATA"
          echo "=========================="

          echo "result<<COZE_EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_DATA" >> $GITHUB_OUTPUT
          echo "COZE_EOF" >> $GITHUB_OUTPUT

      - name: Process Review Result
        id: process
        run: |
          RESULT='${{ steps.coze.outputs.result }}'

          # 解析关键字段用于后续步骤
          SCORE=$(echo "$RESULT" | jq -r '.score // 0')
          CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion // "warning"')
          ERROR_COUNT=$(echo "$RESULT" | jq -r '.statistics.error_count // (.issues // [] | map(select(.severity == "error")) | length)')

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 读取 Coze 输出
            const reviewResult = ${{ steps.coze.outputs.result }};

            // 验证必要字段 - issues 是必需的
            if (!reviewResult.issues || !Array.isArray(reviewResult.issues)) {
              console.error('Coze 输出:', JSON.stringify(reviewResult, null, 2));
              core.setFailed('Coze 输出格式错误：缺少 issues 字段');
              return;
            }

            // 构建 Markdown 评论
            let body = `## 🔍 Coze AI 代码审查报告\n\n`;

            // 头部信息
            const score = reviewResult.score || 0;
            const scoreEmoji = score >= 90 ? '🟢' : score >= 70 ? '🟡' : '🔴';
            body += `### ${scoreEmoji} 综合评分：${score}/100\n\n`;

            // 结论标签
            const conclusion = reviewResult.conclusion || 'warning';
            const conclusionBadge = {
              'pass': '✅ **通过** - 代码质量良好，可以合并',
              'fail': '❌ **失败** - 存在严重问题，必须修复',
              'warning': '⚠️ **警告** - 存在问题，建议修复'
            }[conclusion];
            body += `**审查结论**：${conclusionBadge}\n\n`;

            // 摘要
            if (reviewResult.summary) {
              body += `### 📋 审查摘要\n${reviewResult.summary}\n\n`;
            }

            // 统计信息 - 如果没有提供则计算
            const stats = reviewResult.statistics || {};
            const errorCount = stats.error_count ?? reviewResult.issues.filter(i => i.severity === 'error').length;
            const warningCount = stats.warning_count ?? reviewResult.issues.filter(i => i.severity === 'warning').length;
            const infoCount = stats.info_count ?? reviewResult.issues.filter(i => i.severity === 'info').length;
            
            body += `### 📊 问题统计\n`;
            body += `- ❌ 错误：${errorCount} 个\n`;
            body += `- ⚠️ 警告：${warningCount} 个\n`;
            body += `- ℹ️ 提示：${infoCount} 个\n\n`;

            // 详细问题列表
            if (reviewResult.issues.length > 0) {
              body += `### 📝 详细问题\n\n`;

              // 按文件分组
              const grouped = reviewResult.issues.reduce((acc, issue) => {
                const file = issue.file || '未知文件';
                if (!acc[file]) acc[file] = [];
                acc[file].push(issue);
                return acc;
              }, {});

              for (const [file, issues] of Object.entries(grouped)) {
                body += `<details>\n<summary><b>${file}</b> (${issues.length} 个问题)</summary>\n\n`;

                issues.forEach(issue => {
                  const severityEmoji = {
                    'error': '❌',
                    'warning': '⚠️',
                    'info': 'ℹ️'
                  }[issue.severity] || '•';

                  const lineInfo = issue.line ? `:${issue.line}${issue.end_line ? `-${issue.end_line}` : ''}` : '';

                  body += `${severityEmoji} **${issue.category || '通用'}** \`${file}${lineInfo}\`\n\n`;
                  body += `> ${issue.message}\n\n`;

                  if (issue.suggestion) {
                    body += `**💡 建议**：${issue.suggestion}\n\n`;
                  }

                  if (issue.code_snippet) {
                    body += '```\n' + issue.code_snippet + '\n```\n\n';
                  }

                  if (issue.fixed_code) {
                    body += '**✅ 修复后**：\n```\n' + issue.fixed_code + '\n```\n\n';
                  }

                  if (issue.documentation_link) {
                    body += `📚 [查看文档](${issue.documentation_link})\n\n`;
                  }

                  body += '---\n\n';
                });

                body += '</details>\n\n';
              }
            }

            // 指标信息（可选）
            if (reviewResult.metrics) {
              const m = reviewResult.metrics;
              body += `### 📈 变更指标\n`;
              body += `- 变更文件：${m.total_files_changed || '-'} 个\n`;
              body += `- 新增代码：${m.lines_added || '-'} 行\n`;
              body += `- 删除代码：${m.lines_removed || '-'} 行\n`;
              if (m.complexity_score) body += `- 复杂度评分：${m.complexity_score}\n`;
              body += `\n`;
            }

            body += `\n---\n*⏱️ 分析耗时：${reviewResult.time_cost?.total_time_ms || '-'}ms | 由 Coze AI 自动生成*`;

            // 查找现有评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Coze AI 代码审查报告')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Check Conclusion
        if: ${{ steps.process.outputs.conclusion == 'fail' }}
        run: |
          echo "::error::代码审查未通过，存在严重问题"
          exit 1
